services:
  # O app (Next.js + Socket.IO) e o túnel público do Cloudflare rodam no
  # mesmo processo (`server.ts` sobe o `cloudflared` sozinho quando
  # TUNNEL=cloudflare — ver docs/decisions.md, ADR 011) — não tem mais um
  # serviço `tunnel` separado (existia até uma versão anterior deste
  # arquivo). Isso também resolve o link de convite mostrar `localhost`
  # mesmo rodando em Docker: o app avisa a própria URL pública pra quem
  # entrar, não importa por qual endereço o navegador de quem hospeda abriu
  # a página.
  #
  # O link público aparece nos logs, algo como:
  #   https://palavras-aleatorias.trycloudflare.com
  # Pra ver sem acompanhar ao vivo: `docker compose logs app | grep trycloudflare`.
  # Muda toda vez que a stack sobe — assim que o "quick tunnel" funciona,
  # não precisa de configuração nem conta na Cloudflare.
  #
  # Não quer expor pra internet, só usar na rede local? Comente ou apague a
  # linha `TUNNEL: cloudflare` abaixo antes de subir.
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      TUNNEL: cloudflare
    restart: unless-stopped
